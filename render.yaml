services:
  - type: web
    name: cognivara-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cognivara-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: FAST_ANALYSIS_MODE
        value: "false"
      - key: AUTH_TOKEN_TTL_DAYS
        value: "30"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: FRONTEND_BASE_URL
        sync: false
      - key: EMAIL_VERIFICATION_TTL_HOURS
        value: "24"
      - key: SENTRY_DSN
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false

  - type: web
    name: cognivara-node
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HF_API_KEY
        sync: false
      - key: HF_STT_MODEL
        value: openai/whisper-large-v3-turbo
      - key: HF_STT_FALLBACK_MODEL
        value: openai/whisper-large-v3
      - key: HF_ANALYSIS_MODEL
        value: j-hartmann/emotion-english-distilroberta-base
      - key: HF_EMOTION_MODEL
        value: j-hartmann/emotion-english-distilroberta-base
      - key: HF_SENTIMENT_MODEL
        value: cardiffnlp/twitter-roberta-base-sentiment-latest
      - key: HF_SENTIMENT_FALLBACK_MODEL
        value: distilbert/distilbert-base-uncased-finetuned-sst-2-english
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: SENTRY_DSN
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: cognivara-db
    plan: free
