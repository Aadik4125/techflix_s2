version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cognivara
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/cognivara
    depends_on:
      - postgres
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
